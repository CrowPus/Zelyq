name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  security:
    name: Secrets and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commit history, not only the working tree — a
          # shallow checkout would only ever see the last commit's diff.
          fetch-depth: 0

      # No marketplace action here on purpose: gitleaks-action requires a
      # paid license once a repository is under an organization, and pinning
      # to a downloaded, checksum-verified binary means this step never
      # depends on that changing under us.
      - name: Install gitleaks
        run: |
          # sha256sum -c reads the filename off each checksums.txt line and
          # opens that exact name — it has to match what curl saved to, not
          # just refer to the same release asset. Found live: -o'ing this to
          # a generic gitleaks.tar.gz passed the download and failed
          # verification with "No such file or directory".
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # .gitleaks.toml at the repo root allowlists exactly one fixture file
      # that deliberately contains a fake credential as eval test data —
      # everything else uses gitleaks' full default ruleset.
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=high

      # plugins/ is an independent Node project (its own package-lock.json,
      # not part of the pnpm workspace) — pnpm audit above never sees it.
      - name: Audit plugin library dependencies
        working-directory: plugins
        run: npm audit --audit-level=high

  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose. action-setup v6 reads `packageManager` from
      # package.json, and errors if a version is also given — so the manifest
      # stays the single source of truth for which pnpm builds this project.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The eval harness checks that a generated app actually renders, which
      # needs a real browser. Chromium only — the e2e suite installs the rest
      # when it runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Cached browsers still need their system libraries on a fresh runner.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Lint
        run: pnpm lint

      # Build first: workspace packages resolve to their built output, so a
      # clean checkout cannot typecheck until they exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
