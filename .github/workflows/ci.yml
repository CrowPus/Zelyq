name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"
  # Kept in step with docker/sandbox.Dockerfile, docker/Dockerfile and the
  # starter's own Dockerfile — the toolchain that installs and runs a
  # generated project's Python service.
  UV_VERSION: "0.12.16"

jobs:
  security:
    name: Secrets and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commit history, not only the working tree — a
          # shallow checkout would only ever see the last commit's diff.
          fetch-depth: 0

      # No marketplace action here on purpose: gitleaks-action requires a
      # paid license once a repository is under an organization, and pinning
      # to a downloaded, checksum-verified binary means this step never
      # depends on that changing under us.
      - name: Install gitleaks
        run: |
          # sha256sum -c reads the filename off each checksums.txt line and
          # opens that exact name — it has to match what curl saved to, not
          # just refer to the same release asset. Found live: -o'ing this to
          # a generic gitleaks.tar.gz passed the download and failed
          # verification with "No such file or directory".
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # .gitleaks.toml at the repo root allowlists exactly one fixture file
      # that deliberately contains a fake credential as eval test data —
      # everything else uses gitleaks' full default ruleset.
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=high

      # plugins/ is an independent Node project (its own package-lock.json,
      # not part of the pnpm workspace) — pnpm audit above never sees it.
      - name: Audit plugin library dependencies
        working-directory: plugins
        run: npm audit --audit-level=high

  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version here on purpose. action-setup v6 reads `packageManager` from
      # package.json, and errors if a version is also given — so the manifest
      # stays the single source of truth for which pnpm builds this project.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The eval harness checks that a generated app actually renders, which
      # needs a real browser. Chromium only — the e2e suite installs the rest
      # when it runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Cached browsers still need their system libraries on a fresh runner.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Lint
        run: pnpm lint

      # Build first: workspace packages resolve to their built output, so a
      # clean checkout cannot typecheck until they exist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Pipeline runners are people's own machines — macOS and Windows as well as
  # Linux. These start the machine's own SSH server and run everything a
  # runner does to a machine against it (test/pipeline-machine.test.ts).
  runner-machines:
    name: Runner machine (${{ matrix.expect }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            expect: macos
            tests: test/pipeline-machine.test.ts test/pipeline-scripts.test.ts
          - os: windows-latest
            expect: windows
            tests: test/pipeline-machine.test.ts
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      # A fresh key for this job only, made the way Zelyq makes a team's key.
      - name: Make a test key
        working-directory: apps/server
        shell: bash
        run: |
          node -e "const fs=require('fs');const {utils}=require('ssh2');const p=utils.generateKeyPairSync('ed25519');fs.writeFileSync(process.argv[1],p.private,{mode:0o600});fs.writeFileSync(process.argv[1]+'.pub',p.public+'\\n')" "$RUNNER_TEMP/zelyq_test_key"
          echo "ZELYQ_TEST_SSH_KEY_FILE=$RUNNER_TEMP/zelyq_test_key" >> "$GITHUB_ENV"

      - name: Start SSH (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$RUNNER_TEMP/zelyq_test_key.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist || true
          for i in $(seq 1 30); do nc -z 127.0.0.1 22 && break; sleep 1; done
          echo "ZELYQ_TEST_SSH_USER=$(whoami)" >> "$GITHUB_ENV"

      # The runner's user is an administrator, and Windows OpenSSH reads an
      # administrator's keys from one shared file, which must allow only
      # Administrators and SYSTEM.
      - name: Start SSH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          $file = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$env:RUNNER_TEMP\zelyq_test_key.pub" | Set-Content -Path $file -Encoding ascii
          icacls $file /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'
          "ZELYQ_TEST_SSH_USER=$env:USERNAME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Runner machine tests
        working-directory: apps/server
        env:
          ZELYQ_TEST_SSH_HOST: 127.0.0.1
          ZELYQ_TEST_EXPECT_OS: ${{ matrix.expect }}
        run: node --import tsx --test ${{ matrix.tests }}

  # The React/FastAPI starter is scaffolded verbatim into a user's project, so
  # its own checks are the thing that has to keep passing — a green workspace
  # says nothing about whether a generated Python app still installs and runs.
  python-starter:
    name: React/FastAPI starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/react-fastapi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # --locked is the point: a lockfile that no longer matches pyproject.toml
      # fails here rather than silently resolving something else on a user's
      # first preview.
      - name: Install Python dependencies from the committed lock
        run: uv sync --locked --all-extras
        working-directory: templates/react-fastapi/backend

      - name: Install frontend dependencies from the committed lock
        run: npm ci --no-audit --no-fund --include=dev

      - name: Python lint
        run: uv run --locked --all-extras ruff check .
        working-directory: templates/react-fastapi/backend

      - name: Python types
        run: uv run --locked --all-extras mypy app
        working-directory: templates/react-fastapi/backend

      # From an empty directory, the way a new project starts. Catches a
      # migration that no longer applies to a clean database.
      - name: Migrations apply to a fresh database
        run: |
          rm -rf "$RUNNER_TEMP/dbcheck" && mkdir -p "$RUNNER_TEMP/dbcheck"
          ZELYQ_DATA_DIR="$RUNNER_TEMP/dbcheck" uv run --locked --all-extras alembic upgrade head
        working-directory: templates/react-fastapi/backend

      # The models and the migrations must agree: an autogenerate run against
      # the just-migrated database has to come up with nothing left to do.
      - name: Migrations match the models
        run: |
          ZELYQ_DATA_DIR="$RUNNER_TEMP/dbcheck" uv run --locked --all-extras \
            alembic revision --autogenerate -m drift --rev-id cidriftcheck
          if grep -qE '^\s*op\.' migrations/versions/cidriftcheck_drift.py; then
            echo "Models changed without a migration. Run npm run db:revision -- \"what changed\" and commit it."
            cat migrations/versions/cidriftcheck_drift.py
            exit 1
          fi
          rm -f migrations/versions/cidriftcheck_drift.py
        working-directory: templates/react-fastapi/backend

      - name: API tests
        run: uv run --locked --all-extras pytest -q
        working-directory: templates/react-fastapi/backend

      - name: Frontend types
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      # Regenerates the OpenAPI document and the TypeScript client, and fails
      # if either differs from what is committed.
      - name: API contract is current
        run: npm run api:check

      # npm/pnpm audits never see Python. Advisories are reported without
      # failing the build until an exception policy is agreed — see docs/python.md.
      - name: Python advisories
        continue-on-error: true
        run: |
          uv export --frozen --all-extras --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
        working-directory: templates/react-fastapi/backend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The starter's production container is what a user deploys. It is built
      # here so a broken Dockerfile is caught before it reaches one.
      - name: Build the React/FastAPI starter image
        uses: docker/build-push-action@v7
        with:
          context: templates/react-fastapi
          file: templates/react-fastapi/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
