<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{projectName}}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- zelyq:inspector:start -->
    <!--
      Zelyq's element inspector — see docs/plugins.md for the same
      "smallest honest version" philosophy. Inert until Zelyq's own page
      activates it with a postMessage; does nothing to this app's own
      behavior otherwise. Safe to delete if you'd rather not have it.

      A project made before this shipped, or not started from this
      template at all, gets this same block patched in automatically the
      first time its preview starts — see `039` in the council notes. The
      sentinel comments around this block are what let the server find and
      copy exactly this, and nothing else, into a project that doesn't
      have it yet.
    -->
    <script>
      (function () {
        var ACTIVATE = "zelyq:inspector:activate";
        var DEACTIVATE = "zelyq:inspector:deactivate";
        var SELECTED = "zelyq:inspector:selected";
        var active = false;
        var overlay = null;

        function ensureOverlay() {
          if (overlay) return overlay;
          overlay = document.createElement("div");
          overlay.style.cssText =
            "position:fixed;pointer-events:none;z-index:2147483647;" +
            "border:2px solid #6366f1;background:rgba(99,102,241,0.15);" +
            "border-radius:2px;display:none;";
          document.documentElement.appendChild(overlay);
          return overlay;
        }

        function outline(el) {
          var box = el.getBoundingClientRect();
          var node = ensureOverlay();
          node.style.display = "block";
          node.style.left = box.left + "px";
          node.style.top = box.top + "px";
          node.style.width = box.width + "px";
          node.style.height = box.height + "px";
        }

        function describe(el) {
          var classes =
            el.className && typeof el.className === "string"
              ? el.className.trim().split(/\s+/).filter(Boolean)
              : [];
          var text = (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 80);
          return {
            tag: el.tagName.toLowerCase(),
            id: el.id || undefined,
            classes: classes.slice(0, 4),
            text: text || undefined,
          };
        }

        function onMove(event) {
          if (!active || !(event.target instanceof Element)) return;
          outline(event.target);
        }

        function onClick(event) {
          if (!active || !(event.target instanceof Element)) return;
          // Point at it, don't actually trigger it — a click in select mode
          // describes the element, it never submits a form or follows a link.
          event.preventDefault();
          event.stopPropagation();
          window.parent.postMessage({ type: SELECTED, element: describe(event.target) }, "*");
        }

        window.addEventListener("message", function (event) {
          // Only Zelyq's own page can turn this on — never a random
          // embedder, if this preview is ever reached some other way.
          if (event.source !== window.parent) return;
          if (event.data && event.data.type === ACTIVATE) {
            active = true;
            document.body.style.cursor = "crosshair";
          } else if (event.data && event.data.type === DEACTIVATE) {
            active = false;
            document.body.style.cursor = "";
            if (overlay) overlay.style.display = "none";
          }
        });

        // Capture phase, so this sees the click before the app's own
        // handlers do — required for preventDefault to actually stop it.
        document.addEventListener("mousemove", onMove, true);
        document.addEventListener("click", onClick, true);
      })();
    </script>
    <!-- zelyq:inspector:end -->
  </body>
</html>
