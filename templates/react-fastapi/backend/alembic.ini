[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[post_write_hooks]
# Every generated revision is tidied the moment it is written, so a migration
# never arrives failing the project's own lint check. Autogenerate's output
# (unused `sa`, import order, extra imports it adds for a column type) is
# otherwise a lint failure waiting for whoever runs the checks next.
# `exec`, not `console_scripts`: ruff is a native binary with no Python entry
# point. Found on PATH, which `uv run` points at this project's environment.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix --quiet REVISION_SCRIPT_FILENAME
