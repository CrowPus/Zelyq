id: zelyq/discord-notify
version: 1.0.0
name: Discord notify
description: Post a message to a Discord channel through an incoming webhook.
category: notifications
runs-on:
  os: [linux, macos]
  needs: [curl]
inputs:
  webhook:
    description: The Discord incoming-webhook address
    required: true
    secret: true
  message:
    description: What to post
    default: "Run ${ZELYQ_RUN_NUMBER} of ${ZELYQ_PIPELINE} finished"
outputs:
  status: The HTTP status Discord answered with
steps:
  - name: Post to Discord
    shell: bash
    run: bash "$ZELYQ_PLUGIN_DIR/scripts/send.sh"
