# Host nginx vhost for project previews on *.preview.zelyq.com
#
# Each running preview is a dev server on 127.0.0.1:<port> (port from
# ZELYQ_PREVIEW_PORT_MIN..MAX, currently 4300-4399). This maps
#   https://p<port>.preview.zelyq.com  ->  http://127.0.0.1:<port>
# so previews are served over the same TLS as the app instead of a raw port
# (which HSTS + mixed-content on app.zelyq.com make unreachable).
#
# Prereqs:
#   1. DNS:  *.preview.zelyq.com  A  136.112.104.233   (wildcard)  -- done
#   2. Cert: HTTP-01 webroot for the 100 names p4300..p4399.preview.zelyq.com,
#        named `preview.zelyq.com`, landing at /etc/letsencrypt/live/preview.zelyq.com/.
#        (Wildcard would need DNS-01; there is no certbot DNS plugin here, and
#        the range is fixed, so 100 explicit SANs over HTTP-01 is simpler.)
#        Issued two-phase: HTTP-only vhost -> certbot --webroot -> this file.
#        Re-issue if ZELYQ_PREVIEW_PORT_MIN..MAX changes.
#   3. Zelyq .env:  ZELYQ_PREVIEW_URL_TEMPLATE=https://p{port}.preview.zelyq.com
#      then restart the :8081 server + the :8788 agent.  Keep
#      ZELYQ_PREVIEW_HOST=127.0.0.1 and keep 4300-4399 CLOSED at the GCP
#      firewall -- previews only reach nginx.
#
# Install:
#   sudo cp deploy/previews.preview.zelyq.com.conf /etc/nginx/sites-zelyq/
#   sudo nginx -t && sudo systemctl reload nginx

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^p\d+\.preview\.zelyq\.com$ preview.zelyq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: p<port>.preview.zelyq.com -> 127.0.0.1:<port> --------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^p(?<pport>\d+)\.preview\.zelyq\.com$;

    ssl_certificate     /etc/letsencrypt/live/preview.zelyq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.zelyq.com/privkey.pem;

    # The Zelyq editor embeds the preview in an <iframe> on https://app.zelyq.com.
    # The http{} block sets `X-Frame-Options: SAMEORIGIN`, which forbids that
    # cross-host frame. Defining any add_header here drops the inherited set
    # (nginx does not merge across levels), so XFO is gone; frame-ancestors then
    # allows exactly the editor origin and nothing else.
    add_header Content-Security-Policy "frame-ancestors https://app.zelyq.com" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only proxy to a port inside the Zelyq preview range. Anything else 404s
    # rather than letting the subdomain address an arbitrary local port.
    if ($pport !~ ^43[0-9][0-9]$) { return 404; }

    client_max_body_size 20m;

    location / {
        # proxy_pass carries a variable, so the URI must be given explicitly.
        proxy_pass http://127.0.0.1:$pport$request_uri;
        proxy_http_version 1.1;
        # Vite HMR (and most dev servers) run a WebSocket alongside HTTP.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Present the dev server a Host it trusts by default — Vite / Next / CRA
        # reject an unknown external Host (`server.allowedHosts`) with a 403.
        # The real hostname is still on X-Forwarded-Host for anything that cares.
        proxy_set_header Host              127.0.0.1:$pport;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 15s;
    }
}
