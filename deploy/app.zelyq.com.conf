# Host nginx vhost for app.zelyq.com
#
# Terminates TLS and reverse-proxies to the Zelyq server already running on
# 127.0.0.1:8081 (it serves both the web UI and /api + the /ws websocket from
# one origin). The server process itself is unchanged by this file.
#
# Install:
#   sudo cp deploy/app.zelyq.com.conf /etc/nginx/sites-zelyq/app.zelyq.com.conf
#   # http{} in /etc/nginx/nginx.conf already has:
#   #   include /etc/nginx/sites-zelyq/*.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the cert at /etc/letsencrypt/live/app.zelyq.com/ — see
# deploy/DEPLOY-app.zelyq.com.md. app.zelyq.com must have an A record
# pointing at this VM (136.112.104.233) before the cert can be issued.

upstream zelyq_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.zelyq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.zelyq.com$request_uri;
    }
}

# --- HTTPS: the app ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.zelyq.com;

    ssl_certificate     /etc/letsencrypt/live/app.zelyq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zelyq.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Server bodyLimit is 16 MiB (prompt attachments, skill uploads); leave headroom.
    client_max_body_size 20m;

    # WebSocket: chat/agent stream. Long-lived, must not be timed out.
    location /ws/ {
        proxy_pass http://zelyq_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 15s;
    }

    # API: some routes stream (agent progress, migrations) — generous read timeout.
    location /api/ {
        proxy_pass http://zelyq_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout    600s;
        proxy_connect_timeout 15s;
    }

    # Everything else: the SPA + static assets, served by the same process.
    location / {
        proxy_pass http://zelyq_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 15s;
        proxy_read_timeout    120s;
    }
}
