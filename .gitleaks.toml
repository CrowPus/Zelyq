title = "Zelyq gitleaks config"

# Everything gitleaks ships with, plus one narrow allowlist below. See
# SECURITY.md's "Repository scanning" section for what this runs against
# and why it lives here instead of only in CI.
[extend]
useDefault = true

[allowlist]
description = """
apps/agent/evals/cases.ts is eval fixture data, not application code — some
cases deliberately hand the agent a fake credential (e.g. "sk_live_abc123")
to check it never treats one as real or invents its own. That is the
behaviour under test, not a leak.

apps/server/test/ops-channels.test.ts talks to stand-ins for Telegram, Slack
and Discord, so it needs strings shaped like a bot token or a webhook address
("123456789:AAH-standinTokenForTestsOnly…", "xoxb-1111-2222-standin…",
"discord.com/api/webhooks/42/abc") to check that a real one is accepted, a
wrong one refused, and none ever shown again. They are made up, not leaks.

apps/server/test/team-keys.test.ts likewise sets made-up AI keys
("AIza-guest-own-key-5678", …) to check a team's own key is used first, kept
in its Vault and never shown again.

The Ops tests (ops-actions, ops-brain, ops-memory) hand Ops a made-up Stripe-
shaped value to check it refuses to put a raw secret into an app's settings.
Only those exact made-up values are allowed (the regexes below), not the
files, so a real key added there is still caught.
"""
regexes = [
  '''^sk_live_(0123456789abcdefghijk?|9876543210abcdefghijk|a{21}[1-4])$''',
]
paths = [
  '''^apps/agent/evals/cases\.ts$''',
  '''^apps/server/test/ops-channels\.test\.ts$''',
  '''^apps/server/test/team-keys\.test\.ts$''',
]
